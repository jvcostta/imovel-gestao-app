services:
  # Frontend Next.js (Produção)
  frontend:
    build: .
    container_name: imovel_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: production
    networks:
      - frontend_network

  # Frontend (Desenvolvimento)
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: imovel_frontend_dev
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - frontend_network
    profiles:
      - dev

networks:
  frontend_network:
    driver: bridge
